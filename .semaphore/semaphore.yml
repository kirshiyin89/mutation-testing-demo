version: v1.0
name: Java
agent:
  machine:
    type: e1-standard-2
    os_image: ubuntu2004
blocks:
  - name: Maven
    task:
      jobs:
        - name: Build
          commands:
            - checkout
            - sem-version java 11
            - mvn -B package --file pom.xml
  - name: Test
    task:
      jobs:
        - name: Test
          commands:
            - checkout
            - mvn test
  - name: Security Scan
    task:
      jobs:
        - name: Security Scan
          commands:
            - curl --compressed https://downloads.snyk.io/cli/stable/snyk-linux -o snyk
            - chmod +x ./snyk
            - sudo chmod 777 -R /usr/local/bin/
            - mv ./snyk /usr/local/bin/
            - echo $SNYK_TOKEN
            - SNYK_TOKEN=1ce84c80-9a60-4aef-a806-799636802ed1 snyk test
