version: v1.0
name: Java
agent:
  machine:
    type: e1-standard-2
    os_image: ubuntu2004
blocks:
  - name: Check Current Directory
    task:
      jobs:
        - name: Display Current Directory
          commands:
            - find / -name "pom.xml"
  - name: Maven
    task:
      jobs:
        - name: Build
          commands:
            - checkout
            - sem-version java 11
            - mvn -B package --file pom.xml
  - name: Test
    task:
      jobs:
        - name: Test
          commands:
            - checkout
            - mvn test
  - name: Security Scan
    task:
      secrets:
        - name: Snyk
      jobs:
        - name: Security Scan
          commands:
            - cd /home/semaphore/build
            - ls -l
            - pwd
            - 'curl --compressed https://downloads.snyk.io/cli/stable/snyk-linux -o snyk'
            - chmod +x ./snyk
            - sudo chmod 777 -R /usr/local/bin/
            - mv ./snyk /usr/local/bin/
            - SNYK_TOKEN=$SNYK_TOKEN snyk test
