version: v1.0
name: Java
agent:
  machine:
    type: e1-standard-2
    os_image: ubuntu2004
blocks:
  - name: Maven
    task:
      jobs:
        - name: Build
          commands:
            - checkout
            - sem-version java 11
            - mvn -B package --file pom.xml
  - name: Test
    task:
      jobs:
        - name: Test
          commands:
            - checkout
            - mvn test
  - name: Security Scan
    task:
      jobs:
        - name: Security Scan
          commands:
            - curl -sL  https://downloads.snyk.io/cli/stable/snyk-linux
            - snyk auth $SNYK_TOKEN
            - snyk test
